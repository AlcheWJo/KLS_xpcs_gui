name: Build XPCS GUI executables

# 수동 실행("Run workflow" 버튼) 또는 main 브랜치 push 시 자동 실행.
# Windows/macOS 각각의 GitHub 클라우드 러너에서 PyInstaller로 독립 실행파일을 빌드합니다.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "Particle_Sim_module.py"
      - "xpcs_core.py"
      - "xpcs_gui.py"
      - "requirements.txt"
      - ".github/workflows/build.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # matplotlib/scikit-image/scipy/PyQt5 는 동적 import 가 많아서
      # PyInstaller가 자동으로 못 찾는 서브모듈이 있을 수 있음 -> --collect-all 로 통째로 포함
      - name: Build executable with PyInstaller
        run: >
          pyinstaller --onefile --windowed --name XPCS_GUI
          --collect-all matplotlib
          --collect-all skimage
          --collect-all scipy
          --collect-all PyQt5
          xpcs_gui.py

      - name: Upload Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: XPCS_GUI-windows
          path: dist/XPCS_GUI.exe

      - name: Zip macOS app bundle
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent XPCS_GUI.app XPCS_GUI-mac.zip

      - name: Upload macOS build
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: XPCS_GUI-mac
          path: dist/XPCS_GUI-mac.zip
